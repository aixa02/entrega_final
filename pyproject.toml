[project]
name = "orquestador-multiagente"
version = "1.0.0"
description = "API asíncrona con un orquestador multi-agente (LangGraph), RAG híbrido, HITL y observabilidad."
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi==0.153.0",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",

    # Persistencia
    "redis==8.1.0",
    "langgraph==1.2.14",
    "langgraph-checkpoint-redis==0.5.2",

    # Agentes y LLM
    "langchain==1.4.5",
    "langchain-core==1.6.10",
    "langchain-google-genai==4.4.0",

    # RAG
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.3",
    "langchain-huggingface==1.2.3",
    "langchain-pinecone==0.2.13",
    "pinecone==7.3.0",
    "sentence-transformers==6.2.0",
    "rank-bm25==0.2.2",
    "tiktoken==0.14.0",

    # Observabilidad
    "langsmith==0.14.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
